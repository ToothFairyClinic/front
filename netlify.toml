[build]
  command = "yarn build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Рантайм Next.js для Netlify (SSR, ISR, редиректи з next.config.js)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Шрифти з public/fonts не змінюються (нова версія = нове ім'я файлу), браузер кешує їх на рік
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
