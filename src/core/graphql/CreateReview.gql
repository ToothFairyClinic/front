mutation createReview(
  $client_name: String!
  $client_phone: String!
  $comment: String!
) {
  # без returning: новий відгук до модерації гостю не видно
  insert_reviews(
    objects: {
      comment: $comment
      client_phone: $client_phone
      client_name: $client_name
    }
  ) {
    affected_rows
  }
}

query GetReviews {
  reviews(order_by: {created_at: desc}) {
    created_at
    id
    comment
    client_name
  }
}
