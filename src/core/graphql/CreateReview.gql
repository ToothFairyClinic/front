mutation createReview(
  $client_name: String!
  $client_phone: String!
  $comment: String!
) {
  insert_reviews_one(
    object: {
      comment: $comment
      client_phone: $client_phone
      client_name: $client_name
    }
  ) {
    id
  }
}

query GetReviews {
  reviews(order_by: {created_at: desc}) {
    created_at
    id
    comment
    client_name
  }
}
