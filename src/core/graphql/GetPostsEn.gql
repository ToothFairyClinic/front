query GetPostsEn($limit: Int!, $offset: Int!) {
  posts(
    where: { slug_en: { _is_null: false } }
    order_by: { published_at: desc }
    limit: $limit
    offset: $offset
  ) {
    id
    slug
    slug_en
    title
    title_en
    excerpt
    excerpt_en
    published_at
    hero_image
    hero_image_alt
    hero_image_alt_en
    video
    author {
      id
      name
      name_en
      slug
      slug_en
      image
      categories {
        category {
          title
          title_en
        }
      }
    }
  }
  posts_aggregate(where: { slug_en: { _is_null: false } }) {
    aggregate {
      count
    }
  }
}
